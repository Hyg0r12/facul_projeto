<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <div class="login-container">
        <form class="login-form" id="cadastroForm">
            <h2 id="tituloCadastro"></h2>
            <p>Preencha os dados para se cadastrar</p>

            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000.00" required>
            </div>

            <div class="input-group">
                <label for="numero">Numero</label>
                <input type="tel" id="numero" placeholder="(00) 00000-0000" required>
            </div>

            <div class="input-group">
                <label for="dn">data de nasciento</label>
            <input type="date" id="idade" placeholder="Data de nascimento" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div> 

            <div class="input-group">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" required>
            </div>

            <button type="submit" class="login-btn">Cadastrar</button>

            <p style="margin-top:15px; text-align:center;">
                <a href="../Login/Login.html">Já tenho conta</a>
            </p>

            <p id="mensagem" style="text-align:center; margin-top:10px;"></p>
        </form>
    </div>

    <script src="cadastro.efeito.js"></script>
    <script src="cadastro.js"></script>
    <link rel="stylesheet" href="cadastro.css">
    

</body>
</html>
